name: Tests

# Layers 1-3 of docs/testing-policy.md, on every PR. A 100% pass rate is required to merge. The
# simulator jobs are four timed shards on the newest iPad: each builds once, then runs its share of
# the hosted and UI tests (scripts/ui_shards.py, ADR 0043). Job names here are what
# scripts/update_branch_protection.py's REQUIRED_STATUS_CHECKS lists; rename one and update that
# list in the same PR.
on:
  push:
    branches: [main, "releases/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC: the oldest supported runtime, on main
  workflow_dispatch:
    inputs:
      simulators:
        description: Build the app and run its hosted and UI tests on simulators
        type: boolean
        default: true
      runtimes:
        description: Which iOS runtimes the simulator jobs test on
        type: choice
        options: [newest, oldest, both]
        default: newest

# A new push to a PR, or a new dispatch on the same branch, cancels the stale run. Pushes and the
# weekly run get a group of their own, so they are never cancelled or replaced.
concurrency:
  group: tests-${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # AppCore on Linux: the toolchain a cloud session has, so a green `core` here means the same
  # command passes there (ADR 0007). Also the coverage ratchet.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the toolchain
        run: swift --version
      - name: Test AppCore (100% pass rate required)
        run: swift test --package-path AppCore --enable-code-coverage
      - name: Enforce coverage floor
        run: python3 scripts/check_coverage_floor.py "$(swift test --package-path AppCore --show-codecov-path)"

  # Its own job so a formatting failure is reported on its own line in the checks list.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format and lint (swift format, warnings are errors)
        run: |
          swift format lint --strict --parallel --recursive \
            App AppTests AppUITests AppCore/Package.swift AppCore/Sources AppCore/Tests

  # The release, coverage and simulator scripts, and the no-project-history guard (ADR 0008).
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test scripts/
        run: python3 -m unittest discover -s scripts/tests -v

  # The hosted tests and the UI tests on simulators, as four shards so a failed shard is re-run
  # alone ("Re-run failed jobs") and no job runs for long. scripts/ui_shards.py balances the shards
  # from measured timings. Each job builds for itself, then runs its share.
  ui:
    name: ui (ipad, ${{ matrix.runtime }}, ${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' || inputs.simulators
    runs-on: macos-latest
    # A shard's job takes about 21 minutes on a typical runner and up to about 27 on a slow one:
    # some 7 minutes of build, boot and xcodebuild start-up, then its share of the tests.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON((github.event_name == 'schedule' || inputs.runtimes == 'both') && '["newest","oldest"]' || (inputs.runtimes == 'oldest' && '["oldest"]' || '["newest"]')) }}
        shard: [1, 2, 3, 4]
    env:
      RUNTIME: ${{ matrix.runtime }}
      SHARD: ${{ matrix.shard }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode
        run: xcodebuild -version
      # project.yml's minimumXcodeGenVersion refuses anything older than the spec needs (ADR 0003).
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        run: |
          destination=$(python3 scripts/simulator.py --family ipad --runtime "$RUNTIME")
          echo "DESTINATION=$destination" >> "$GITHUB_ENV"
      - name: Choose this shard's tests
        run: |
          args=$(python3 scripts/ui_shards.py --shard "$SHARD")
          echo "SHARD_ARGS=$args" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project Magenda.xcodeproj -scheme Magenda \
            -destination "$DESTINATION" -derivedDataPath build/DerivedData -quiet
      # The boot comes after the build: a boot that overlaps the build slows it from about 1 minute
      # to 4-7 minutes. `bootstatus -b` returns only once the device is fully up, so the first test
      # does not launch into a half-booted simulator.
      - name: Boot the simulator and wait for it
        run: xcrun simctl bootstatus "${DESTINATION#id=}" -b
      - name: Tests (100% pass rate required)
        run: |
          # SHARD_ARGS is deliberately unquoted: it is several -only-testing words.
          xcodebuild test-without-building -project Magenda.xcodeproj -scheme Magenda \
            -destination "$DESTINATION" -derivedDataPath build/DerivedData \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 1200 \
            $SHARD_ARGS -resultBundlePath "build/tests-$SHARD.xcresult"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-ipad-${{ matrix.runtime }}-${{ matrix.shard }}
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
