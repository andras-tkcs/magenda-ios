name: Tests

# Layers 1-3 of docs/testing-policy.md, on every PR. A 100% pass rate is required to merge. The
# simulator jobs are four timed shards on the newest iPad: each builds once, then runs its share of
# the hosted and UI tests (scripts/ui_shards.py, ADR 0043). Job names here are what
# scripts/update_branch_protection.py's REQUIRED_STATUS_CHECKS lists; rename one and update that
# list in the same PR.
on:
  push:
    branches: [main, "releases/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC: the oldest supported runtime, on main
  workflow_dispatch:
    inputs:
      simulators:
        description: Build the app and run its hosted and UI tests on simulators
        type: boolean
        default: true
      runtimes:
        description: Which iOS runtimes the simulator jobs test on
        type: choice
        options: [newest, oldest, both]
        default: newest
      only:
        description: "Run only these tests, in one simulator job instead of the shards: comma-separated MagendaTests, MagendaUITests/<Class> or MagendaUITests/<Class>/<test>. Not a merge gate."
        type: string
        default: ""

# A new push to a PR, or a new dispatch on the same branch, cancels the stale run. Pushes and the
# weekly run get a group of their own, so they are never cancelled or replaced.
concurrency:
  group: tests-${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # AppCore on Linux: the toolchain a cloud session has, so a green `core` here means the same
  # command passes there (ADR 0007). Also the coverage ratchet.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the toolchain
        run: swift --version
      - name: Test AppCore (100% pass rate required)
        run: swift test --package-path AppCore --enable-code-coverage
      - name: Enforce coverage floor
        run: python3 scripts/check_coverage_floor.py "$(swift test --package-path AppCore --show-codecov-path)"

  # Its own job so a formatting failure is reported on its own line in the checks list.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format and lint (swift format, warnings are errors)
        run: |
          swift format lint --strict --parallel --recursive \
            App AppTests AppUITests AppCore/Package.swift AppCore/Sources AppCore/Tests

  # The release, coverage and simulator scripts, and the no-project-history guard (ADR 0008).
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test scripts/
        run: python3 -m unittest discover -s scripts/tests -v

  # The hosted tests and the UI tests on simulators, as four shards so a failed shard is re-run
  # alone ("Re-run failed jobs") and no job runs for long. scripts/ui_shards.py balances the shards
  # from measured timings. Each job builds for itself, then runs its share.
  # A dispatch that names tests to run only (ADR 0048) runs one job per runtime with just those
  # tests, for iterating; it is never the merge gate.
  ui:
    name: ui (ipad, ${{ matrix.runtime }}, ${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' || inputs.simulators
    runs-on: macos-latest
    # A shard's job takes about 28 minutes on a typical runner: some 12 minutes of build, boot,
    # warm-up and xcodebuild start-up, then about 16 of tests. A slow runner runs the tests up to
    # 1.5 times slower and can take 7 minutes to boot and 5 to warm up, about 43 in all (ADR 0045,
    # ADR 0049). A hung test fails on its own time allowance long before this limit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON((github.event_name == 'schedule' || inputs.runtimes == 'both') && '["newest","oldest"]' || (inputs.runtimes == 'oldest' && '["oldest"]' || '["newest"]')) }}
        shard: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.only) && '["only"]' || '[1, 2, 3, 4]') }}
    env:
      RUNTIME: ${{ matrix.runtime }}
      SHARD: ${{ matrix.shard }}
      ONLY: ${{ inputs.only }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode
        run: xcodebuild -version
      # project.yml's minimumXcodeGenVersion refuses anything older than the spec needs (ADR 0003).
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        run: |
          destination=$(python3 scripts/simulator.py --family ipad --runtime "$RUNTIME")
          echo "DESTINATION=$destination" >> "$GITHUB_ENV"
      - name: Choose this shard's tests
        run: |
          if [ "$SHARD" = only ]; then
            args=$(python3 scripts/ui_shards.py --only "$ONLY")
          else
            args=$(python3 scripts/ui_shards.py --shard "$SHARD")
          fi
          echo "SHARD_ARGS=$args" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project Magenda.xcodeproj -scheme Magenda \
            -destination "$DESTINATION" -derivedDataPath build/DerivedData -quiet
      # The boot comes after the build: a boot that overlaps the build slows it from about 1 minute
      # to 4-7 minutes. `bootstatus -b` returns only once the device is fully up, so the first test
      # does not launch into a half-booted simulator. A boot that fails is retried once on the
      # erased device. The app is then installed and launched once on its fixture: the first launch
      # on a just-booted device can take longer than XCTest's own launch time-out, and here it is
      # paid outside the tests.
      - name: Boot the simulator and wait for it
        run: |
          udid="${DESTINATION#id=}"
          if ! xcrun simctl bootstatus "$udid" -b; then
            echo "::warning::the simulator did not boot; erasing it and booting it again"
            xcrun simctl shutdown "$udid" || true
            xcrun simctl erase "$udid"
            xcrun simctl bootstatus "$udid" -b
          fi
          xcrun simctl install "$udid" build/DerivedData/Build/Products/Debug-iphonesimulator/Magenda.app
          if xcrun simctl launch "$udid" name.tkcs.magenda -MagendaFixture standard -MagendaNoAnimations; then
            xcrun simctl terminate "$udid" name.tkcs.magenda || true
          else
            echo "::warning::the warm-up launch failed; the first test pays the cold launch"
          fi
      # Before the tests, and again after a lost simulator is booted again, a throwaway UI test
      # takes XCTest's first accessibility snapshot in its own xcodebuild run, whose result is
      # ignored: on a just-booted simulator that snapshot can time out and end the test it hits
      # (ADR 0049). xcodebuild exits 70 when it cannot find the destination: the simulator
      # service on a hosted runner sometimes loses the booted device between steps. Then the
      # simulator is picked and booted again and the tests run once more. A failed test exits 65
      # and is never retried.
      - name: Tests (100% pass rate required)
        run: |
          warm_up() {
            if ! xcodebuild test-without-building -project Magenda.xcodeproj -scheme Magenda \
                -destination "$DESTINATION" -derivedDataPath build/DerivedData \
                -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
                -maximum-test-execution-time-allowance 300 \
                -only-testing:MagendaUITests/WarmUpUITests; then
              echo "::warning::the warm-up test failed; the job's tests run anyway"
            fi
          }
          run_tests() {
            # SHARD_ARGS is deliberately unquoted: it is several -only-testing words.
            xcodebuild test-without-building -project Magenda.xcodeproj -scheme Magenda \
              -destination "$DESTINATION" -derivedDataPath build/DerivedData \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 1200 \
              $SHARD_ARGS -resultBundlePath "build/tests-$SHARD.xcresult"
          }
          warm_up
          status=0
          run_tests || status=$?
          if [ "$status" -ne 70 ]; then
            exit "$status"
          fi
          echo "::warning::xcodebuild could not find the simulator; picking and booting it again"
          DESTINATION=$(python3 scripts/simulator.py --family ipad --runtime "$RUNTIME")
          xcrun simctl bootstatus "${DESTINATION#id=}" -b
          rm -rf "build/tests-$SHARD.xcresult"
          warm_up
          run_tests
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-ipad-${{ matrix.runtime }}-${{ matrix.shard }}
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
